[project]
name = "efficharge"
version = "0.1.0"
description = "Charge batteries when electricity is cheap and green. Hosted, no installation."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.28,<0.29",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.20,<0.22",
    "alembic>=1.14,<2",
    "cryptography>=49,<51",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1,<4",
    "babel>=2.16,<3",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.18,<1",
    "itsdangerous>=2.2,<3",
    "meross-iot>=0.4.7,<0.5",
]

[project.urls]
Source = "https://github.com/AndreasGerken/efficharge"
Issues = "https://github.com/AndreasGerken/efficharge/issues"

[project.scripts]
efficharge = "efficharge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1.1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# generated by alembic
extend-exclude = ["efficharge/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
# Unicode (×, →, –, €) is intentional in docs and UI strings.
ignore = ["RUF001", "RUF002", "RUF003"]
